<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faracol — Sign In</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <div class="auth-card">

      <div class="brand">
       <img src="assets/images/company logo.png" alt="Company Logo" class="brand-logo">
        <h1 class="brand-name">FARACOL AUTOS LTD</h1>
        <p class="brand-tagline">Fleet Ledger Management System</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@faracol.com"
            autocomplete="username"
            required
          >
          <span class="form-error" id="email-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="password-error" role="alert"></span>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember-me">
            <span>Remember me</span>
          </label>
          <a href="#" class="form-link" id="forgot-password-link">Forgot password?</a>
        </div>

        <div class="auth-banner auth-banner-error" id="login-banner" role="alert" hidden></div>

        <button type="submit" class="btn btn-primary btn-full" id="login-submit">
          <span class="btn-label">Sign In</span>
          <span class="btn-spinner" hidden></span>
        </button>

      </form>

    </div>

    <!-- TODO: Replace footer text/year source once branding is finalized -->
    <footer class="auth-footer">
      <p>&copy; <span id="current-year"></span> Fleet Ledger. All rights reserved.</p>
    </footer>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
